    <!-- Critical inline CSS: prevents blank flash before JS loads -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;font-family:'Sarabun',system-ui,sans-serif;background:#F0F4FA}
      #root{min-height:100vh;display:flex;flex-direction:column}
      #app-loading{
        position:fixed;inset:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;
        background:linear-gradient(160deg,#F0F4FF 0%,#E8EEFF 30%,#F5F0FF 60%,#EEF3FB 100%);
        z-index:9999;transition:opacity 0.3s ease;
      }
      #app-loading h1{
        font-size:1.5rem;font-weight:700;color:#2563EB;
        margin-bottom:0.5rem;letter-spacing:-0.01em;
      }
      #app-loading p{font-size:0.875rem;color:#94a3b8}
      #app-loading .spinner{
        width:36px;height:36px;border:3px solid rgba(79,142,247,0.2);
        border-top-color:#4F8EF7;border-radius:50%;
        animation:spin 0.8s linear infinite;margin-bottom:1rem;
      }
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <!-- Loading screen shown before React boots (improves FCP) -->
    <div id="app-loading" aria-hidden="true">
      <div class="spinner"></div>
      <h1>S.T. ก้าวหน้า</h1>
      <p>ระบบดิจิทัลสภานักเรียน</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide loading screen once React mounts
      document.addEventListener('DOMContentLoaded', function() {
        var obs = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var loader = document.getElementById('app-loading');
            if (loader) { loader.style.opacity = '0'; setTimeout(function(){ loader.remove(); }, 300); }
            obs.disconnect();
          }
        });
        obs.observe(document.getElementById('root'), { childList: true });
      });
    </script>
  </body>
